name: Validate travel website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate static files and internal links
        run: python3 scripts/validate.py
      - name: Validate itinerary, architecture and booking data
        run: node scripts/check-data.cjs
      - name: Validate all hotel date and App links
        run: node scripts/check-hotel-links.cjs
# Publication is managed by GitHub Pages: main branch / (root).
