name: Validate and publish travel website
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: travel-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate the site
        run: |
          python3 scripts/validate.py
          node scripts/check-data.cjs
          node scripts/check-hotel-links.cjs
      - name: Stage public files
        run: |
          mkdir _site
          git archive HEAD .nojekyll assets '*.html' '*.css' '*.js' '*.csv' '*.json' itinerary.md | tar -x -C _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clear the previous stalled Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/deployments/a0cb3e3b506f7959aa6bb4e49da2c81a7add386a/cancel"
          gh api "repos/$GITHUB_REPOSITORY/pages/deployments/a0cb3e3b506f7959aa6bb4e49da2c81a7add386a"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
